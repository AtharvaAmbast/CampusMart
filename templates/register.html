{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Register for CampusMart</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Profile Name (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="Unique username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">VIT Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name.surname2026@vitstudent.ac.in" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">Create Account</button>
                </form>
                <div class="text-center">
                    <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
