{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Your Inbox</h3>
        </div>
        <div class="alert alert-light border small text-muted">
            <strong>Tip:</strong> Left-click a user to open the chat. <strong>Right-click</strong> a user to set a custom alias.
        </div>
        
        <div class="list-group shadow-sm" id="inboxList">
            <!-- Populated via JS -->
            <div class="text-center p-4 text-muted">Loading messages...</div>
        </div>
    </div>
</div>

<script>
    function loadInbox() {
        fetch('/api/inbox_contacts')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('inboxList');
                list.innerHTML = '';
                
                if (data.status === 'success') {
                    if (data.data.length === 0) {
                        list.innerHTML = '<div class="list-group-item text-center text-muted p-4">No conversations yet.</div>';
                        return;
                    }
                    
                    data.data.forEach(contact => {
                        const item = document.createElement('a');
                        // Left click routes to chat
                        item.href = `/chat/${contact.id}`;
                        item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3';
                        
                        let displayHTML = `<div><strong class="mb-1 d-block">${contact.display_name}</strong>`;
                        if(contact.display_name !== contact.email) {
                            displayHTML += `<small class="text-muted">${contact.email}</small>`;
                        }
                        displayHTML += `</div>`;
                        
                        // Red dot marker for unread messages
                        if (contact.has_unread) {
                            displayHTML += `<span class="bg-danger rounded-circle d-inline-block" style="width: 12px; height: 12px;" title="New message"></span>`;
                        }
                        
                        item.innerHTML = displayHTML;
                        
                        // Right click to set alias
                        item.addEventListener('contextmenu', function(ev) {
                            ev.preventDefault(); // Prevent standard browser menu
                            let currentAlias = contact.display_name !== contact.email ? contact.display_name : "";
                            let newAlias = prompt(`Set an alias for ${contact.email}:`, currentAlias);
                            
                            if (newAlias !== null && newAlias.trim() !== "") {
                                fetch('/api/set_alias', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({contact_id: contact.id, alias: newAlias.trim()})
                                }).then(res => res.json()).then(res => {
                                    if(res.status === 'success') loadInbox(); // Refresh list
                                });
                            }
                        });
                        
                        list.appendChild(item);
                    });
                }
            });
    }
    
    // Load immediately and poll every 5 seconds for new dots
    loadInbox();
    setInterval(loadInbox, 5000);
</script>
{% endblock %}
