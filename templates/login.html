{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Log In to CampusMart</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username or VIT Email</label>
                        <input type="text" name="login_id" class="form-control" placeholder="Username or Email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
                </form>
                <div class="text-center">
                    <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
